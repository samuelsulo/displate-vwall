# Git hooks. Each project adds its own (lint, format, tests) as it needs them.
commit-msg:
  commands:
    conventional-commit:
      run: cog verify --file {1}

pre-commit:
  commands:
    secrets-gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner
    web-format:
      root: web/
      glob: "web/src/**/*.{ts,vue,css,json}"
      run: npx prettier --check {staged_files}
    web-lint:
      root: web/
      glob: "web/**/*.{ts,vue}"
      run: npm run lint
    web-type-check:
      root: web/
      glob: "web/**/*.{ts,vue}"
      run: npm run type-check
