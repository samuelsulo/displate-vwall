# Cocogitto: one tag vX.Y.Z for the whole repo. For per-component tags see the repo-standard skill.
tag_prefix = "v"
ignore_merge_commits = true

# repo, version and docs always. Add one scope per component in the same change that adds it.
scopes = ["repo", "version", "docs", "ci", "deps", "scripts"]

post_bump_hooks = [
  "git push origin HEAD && git push origin v{{version}} && gh release create v{{version}} --title \"v{{version}}\" --notes \"$(cog changelog --at v{{version}})\"",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
