# Which profile and parts this repo has, so an audit knows what to expect.
# Edit it in the same change that adds or removes a part.
standard: 1

# client | platform | product | tooling
profile: product

parts:
  # Every deployable thing is a folder under apps/. Empty list when there is none.
  apps: []
  # true when packages/ exists (code shared between apps).
  packages: false
  # none | single-account | multi-account
  infrastructure: none
  # true when brand/ exists.
  brand: false

# single: one tag vX.Y.Z for the whole repo
# per-component: one tag per app, infrastructure and brand (<name>/vX.Y.Z)
versioning: single

# The tag of template-project this repo was created from or last aligned with.
template: v0.1.0
